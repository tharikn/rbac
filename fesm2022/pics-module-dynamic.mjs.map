<div class="card">
  <div class="col my-3" *ngIf="isTitle">
    <button type="button" class="btn btn-cancel" (click)="location.back()" *ngIf="showTabBack">
      Back {{ parentGridPage && 'to ' + parentGridPage }}
    </button>
    <h6 class="font-weight-bold mt-3 mb-0 fromTitle">{{ isTitle }}</h6>
  </div>
  <div class="row" *ngIf="!showOcrForm">
    <div class="col-12 dynamic-page mt-0" *ngIf="isformIO">
      <formio #formIO [form]="jsonForm" [readOnly]="isReadOnly" [submission]="submittedData" (submit)="onSubmit($event)"
        (change)="customEvents($event)" (click)="customClickEvents(submittedData, $event)"
        (customEvent)="customEventsButton($event)" [refresh]="triggerRefresh" [success]="submitSuccess"
        [error]="submitFailed" (customEvent)="customEvent($event)"></formio>
    </div>
  </div>

  <div class="row" *ngIf="showOcrForm">
    <div class="col-12 dynamic-page mt-0">
      <app-ocr-validation (ocrResponse)="getEmittedData($event)" [currenttemplateResult]="templateResult"
        [formResponseData]="formResponse" [submitionData]="submittedData"></app-ocr-validation>
    </div>
  </div>
</div>
<button style="display: none" id="external_scanner" #external_scanner mat-raised-button class="btn-icon-bg"
  (ngxf-select)="uploadFile($event)">
  Scan
</button>
